[project]
name = "enterprise-lakehouse"
version = "0.1.0"
description = "Enterprise Lakehouse Platform: medallion pipeline (PySpark + Delta Lake) with batch control, data quality and reconciliation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyarrow>=17,<22",
    "pydantic>=2.8,<3",
    "pyyaml>=6.0,<7",
    "sqlalchemy>=2.0.30,<2.1",
    "psycopg[binary]>=3.2,<4",
    "boto3>=1.35,<2",
]

[project.optional-dependencies]
# Processing runtime (needs Java 17). Kept optional so the API image does not ship a JVM stack.
spark = [
    # Spark 3.5 line: Delta 3.3 is built for it and both run on Java 17 / Python 3.12.
    "pyspark==3.5.7",
    "delta-spark==3.3.2",
]
api = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    # delta-rs: the API reads published Gold versions without starting a JVM.
    "deltalake>=1.0,<2",
    "prometheus-client>=0.21,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5,<8",
    "httpx>=0.27,<1",
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
    "types-PyYAML>=6.0",
    "psutil>=6,<8",
]

[project.scripts]
lakehouse = "lakehouse.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lakehouse"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["data", ".lake"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "N"]
ignore = [
    "PLR0913",  # Spark job functions legitimately take many explicit parameters
    "PLR2004",  # magic values are fine in tests and rule thresholds
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "RUF012",
    "PLR0917",  # same rationale as PLR0913
    "N812",     # `functions as F` is the PySpark idiom
    "N818",     # InjectedFailure reads better than InjectedFailureError in tests
    "PLC0415",  # deferred imports are deliberate: pyspark/delta stay out of the API and light CLI paths
    "E501",     # line length is enforced by `ruff format`; tabular literals are left as written
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101", "N802"]
"dags/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["lakehouse"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "spark: needs a local SparkSession (JVM, no Docker services)",
    "integration: needs the Docker Compose services (PostgreSQL, MinIO)",
    "resilience: failure-injection and re-execution scenarios",
]
filterwarnings = [
    "ignore::DeprecationWarning:pyspark.*",
    # Third-party notice from starlette's TestClient about its HTTP backend; not actionable here.
    "ignore:Using `httpx` with `starlette.testclient`",
]
