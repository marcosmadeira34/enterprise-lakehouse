global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The API exposes metrics derived from the operational metadata (runs, batches, quality, publications).
  - job_name: lakehouse
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
