# Default configuration. Every key can be overridden by an environment variable named
# LAKEHOUSE__<SECTION>__<KEY> (e.g. LAKEHOUSE__STORAGE__LAKE_URI=s3://lakehouse).
# Secrets are never stored here: S3 keys and database URLs come from the environment.

environment: local

storage:
  # Local paths are resolved relative to the working directory; s3:// URIs go to the S3 endpoint.
  landing_uri: ./data/landing
  lake_uri: ./data/lake
  s3_endpoint_url: null          # e.g. http://minio:9000 (env LAKEHOUSE__STORAGE__S3_ENDPOINT_URL)
  s3_region: us-east-1
  s3_path_style: true

metadata:
  # Overridden in Docker by LAKEHOUSE__METADATA__URL (PostgreSQL).
  url: sqlite:///./data/metadata.db

spark:
  master: local[2]
  app_name: enterprise-lakehouse
  driver_memory: 2g
  shuffle_partitions: 8
  # Ivy cache for the Delta / hadoop-aws jars; null uses Spark's default (~/.ivy2).
  ivy_dir: null
  extra_conf: {}

pipeline:
  source_system: retail-pos
  # Lease of the per-entity processing lock. Must exceed the longest expected task.
  lock_ttl_seconds: 7200
  # A RUNNING run older than this is considered abandoned by `lakehouse recover`.
  stale_run_seconds: 10800

business_rules:
  # Timestamps are interpreted as UTC. Events later than now + this tolerance are rejected.
  max_future_days: 1
  min_valid_date: "2015-01-01"
  # Absolute tolerance (currency units) for financial consistency checks.
  money_tolerance: "0.01"
  # Negative stock means a backorder in this domain: reported as a warning unless disabled.
  allow_negative_stock: true
  allowed_currencies: [BRL]

quality:
  # Fraction of rejected records in a batch above which the Silver step fails the run.
  max_reject_ratio: 0.25
  volume_anomaly:
    lookback_batches: 5
    min_history: 3
    min_ratio: 0.5
    max_ratio: 2.0
